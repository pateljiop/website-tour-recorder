name: Record website tour

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Full homepage URL to record"
        required: true
        default: "https://haryomix.eu.cc"
        type: string
      route_paths:
        description: "Comma-separated routes to visit, e.g. /tools,/pdf-editor"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Configure requested tour
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          ROUTE_PATHS: ${{ inputs.route_paths }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.parse import urlparse
          path = urlparse(os.environ["WEBSITE_URL"])
          if path.scheme not in ("http", "https") or not path.netloc:
              raise SystemExit("website_url must be a valid http(s) URL")
          with open("config.json", encoding="utf-8") as f:
              cfg = json.load(f)
          cfg["base_url"] = os.environ["WEBSITE_URL"].rstrip("/")
          cfg["browser"]["headless"] = True
          cfg["browser"]["device_scale_factor"] = 1
          routes = [r.strip() for r in os.environ.get("ROUTE_PATHS","").split(",") if r.strip()]
          cfg["routes"] = [{"name": r, "path": r} for r in routes]
          with open("config.json","w",encoding="utf-8") as f:
              json.dump(cfg,f,indent=2)
          PY

      - name: Record tour
        run: python recorder.py

      - name: Upload MP4 and original WebM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-tour-video
          path: |
            recordings/*.mp4
            temp/**/*.webm
          if-no-files-found: warn
          retention-days: 7
